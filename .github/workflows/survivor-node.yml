name: Survivor native candidate
on:
  push:
    branches: [main]
    paths:
      - 'tools/survivor-node/**'
      - 'docs/protocol/survivor-v1/**'
      - '.github/workflows/survivor-node.yml'
  pull_request:
    paths:
      - 'tools/survivor-node/**'
      - 'docs/protocol/survivor-v1/**'
      - '.github/workflows/survivor-node.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/survivor-node/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/survivor-node/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/survivor-node/Cargo.toml
