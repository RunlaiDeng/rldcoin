name: Survivor native candidate
on:
  push:
    branches: [main]
    paths:
      - 'tools/survivor-node/**'
      - 'docs/protocol/survivor-v1/**'
      - 'docs/protocol/PAYMENT_CAPSULE_V1.md'
      - 'docs/protocol/payment-capsule-v1-vectors.json'
      - '.github/workflows/survivor-node.yml'
  pull_request:
    paths:
      - 'tools/survivor-node/**'
      - 'docs/protocol/survivor-v1/**'
      - 'docs/protocol/PAYMENT_CAPSULE_V1.md'
      - 'docs/protocol/payment-capsule-v1-vectors.json'
      - '.github/workflows/survivor-node.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/survivor-node/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/survivor-node/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/survivor-node/Cargo.toml -- --test-threads=1
      - run: cargo build --locked --release --manifest-path tools/survivor-node/Cargo.toml --bins
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source
      - run: tools/survivor-node/target/release/rld-survivor-package . tools/survivor-node/target/release/rld-survivor-node survivor-novalue.tar
      - uses: actions/upload-artifact@v4
        with:
          name: Survivor-NOVALUE-${{ runner.os }}-${{ runner.arch }}
          path: |
            survivor-novalue.tar
            survivor-novalue.tar.sha256
          if-no-files-found: error
