name: Survivor specification vectors

on:
  push:
    paths:
      - 'docs/protocol/survivor-v1/**'
      - 'tools/survivor-spec-vectors/**'
      - '.github/workflows/survivor-spec.yml'
  pull_request:
    paths:
      - 'docs/protocol/survivor-v1/**'
      - 'tools/survivor-spec-vectors/**'
      - '.github/workflows/survivor-spec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-no-value-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: openssl version
      - run: cargo fmt --manifest-path tools/survivor-spec-vectors/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path tools/survivor-spec-vectors/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/survivor-spec-vectors/Cargo.toml
      - run: cargo run --locked --manifest-path tools/survivor-spec-vectors/Cargo.toml -- check docs/protocol/survivor-v1/vectors.json
