name: Rldcoin protocol CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s tools/source-evidence -v
      - run: python3 -B -m unittest discover -s tools/implementation-source -v
      - run: cd vectors/m0-genesis-v3 && sha256sum -c manifest.json.sha256
      - run: cd vectors/m0-semantic-replay-v1 && sha256sum -c SHA256SUMS

  native-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  regional-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/regional-ledger/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/regional-ledger/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/regional-ledger/Cargo.toml --locked
