name: Rldcoin protocol CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: cargo run --locked -p rld-cli --bin rld-maintenance -- scan-documents --root .
      - run: cargo run --locked -p rld-cli --bin rld-maintenance -- check-rust-only --root .
      - run: cargo test --locked -p rld-cli --bin rld-maintenance
      - run: cd vectors/m0-genesis-v3 && sha256sum -c manifest.json.sha256
      - run: cd vectors/m0-semantic-replay-v1 && sha256sum -c SHA256SUMS

  native-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache compiled outputs and public dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-native-workspace-dev-test-opt1-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml', 'crates/**', 'vectors/**', 'spec/**', 'docs/spec/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-native-workspace-debug-${{ hashFiles('Cargo.lock') }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=1
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

  regional-native:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "3"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache compiled outputs and public dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/regional-ledger/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-regional-native-test-opt3-${{ hashFiles('tools/regional-ledger/Cargo.lock') }}-${{ hashFiles('tools/regional-ledger/Cargo.toml', 'tools/regional-ledger/build.rs', 'tools/regional-ledger/src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'vectors/**', 'spec/**', 'docs/spec/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-regional-native-test-opt3-${{ hashFiles('tools/regional-ledger/Cargo.lock') }}-
      - name: Create existing unit fixture parent
        run: mkdir -p tmp
      - run: cargo fmt --manifest-path tools/regional-ledger/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/regional-ledger/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path tools/regional-ledger/Cargo.toml --locked --bin rld-regional-ledger-candidate --bin contact-fixture --bin contact-mesh
      - name: Verify native fixtures in an owned private temporary directory
        run: |
          fixture_temp=$(mktemp -d "$RUNNER_TEMP/rld-native.XXXXXXXX")
          chmod 700 "$fixture_temp"
          TMPDIR="$fixture_temp" cargo test --manifest-path tools/regional-ledger/Cargo.toml --locked -- --test-threads=1
        env:
          RLD_EXPORT_ARCHIVE_CANDIDATE_CLI: ${{ github.workspace }}/tools/regional-ledger/target/debug/rld-regional-ledger-candidate
