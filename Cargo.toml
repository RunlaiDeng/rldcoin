[workspace]
resolver = "2"
members = ["crates/protocol", "crates/node", "crates/cli", "crates/prover", "methods"]
default-members = ["crates/protocol", "crates/node", "crates/cli"]
exclude = ["methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minicbor = { version = "0.25.1", features = ["std", "derive"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "zeroize"] }
argon2 = "0.5.3"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
chacha20poly1305 = "0.10"
fs2 = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
axum = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"] }
bincode = "1.3"

[profile.release]
overflow-checks = true
lto = "thin"

[profile.dev]
overflow-checks = true
