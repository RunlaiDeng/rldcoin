# Public gateway for the isolated value-free testnet only.
server {
    listen 80;
    listen [::]:80;
    server_name api.rldcoin.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rldcoin.com;
    ssl_certificate /etc/letsencrypt/live/api.rldcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rldcoin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    # This gateway annotates every response as worthless test currency.
    location ^~ /v1/testnet/ {
        client_max_body_size 3m;
        client_body_timeout 15s;
        limit_req zone=rld_read burst=20 nodelay;
        limit_req_status 429;
        limit_conn rld_read_conn 8;
        proxy_pass http://127.0.0.1:48540;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}
