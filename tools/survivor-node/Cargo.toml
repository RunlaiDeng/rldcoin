[package]
name = "rld-survivor-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[workspace]

[dependencies]
curve25519-dalek = "=4.1.3"
ed25519-dalek = "=2.1.1"
hex = "=0.4.3"
sha2 = "=0.10.8"
serde_json = "=1.0.134"
rusqlite = { version = "0.38.0", features = ["bundled"] }
fs2 = "0.4.3"
aes-gcm = "=0.10.3"
scrypt = "=0.11.0"
getrandom = "=0.2.17"
zeroize = "=1.9.1"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
