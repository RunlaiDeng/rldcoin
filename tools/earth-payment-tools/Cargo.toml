[package]
name = "rld-earth-payment-tools"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "=1.0.95"
axum = { version = "=0.8.1", features = ["macros"] }
clap = { version = "=4.5.23", features = ["derive", "env"] }
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
tokio = { version = "=1.42.0", features = ["full"] }
zeroize = "=1.9.0"
rld-core = { path = "../../crates/rld-core" }
rld-pow = { path = "../../crates/rld-pow" }
rld-fast-payments = { path = "../../crates/rld-fast-payments" }
rld-value-successor = { path = "../../crates/rld-value-successor" }
