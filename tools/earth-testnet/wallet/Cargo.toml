[package]
name = "rld-earth-wallet"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "=1.0.103"
axum = "=0.8.1"
clap = { version = "=4.5.23", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
tokio = { version = "=1.53.1", features = ["full"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
rand = "=0.8.6"
zeroize = "=1.9.0"
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
rld-core = { path = "../../crates/rld-core" }
rld-pow = { path = "../../crates/rld-pow" }
rld-fast-payments = { path = "../../crates/rld-fast-payments" }
rld-value-successor = { path = "../../crates/rld-value-successor" }

rld-cross-region = { path = "../../crates/rld-cross-region" }

[profile.dev]
debug = 0
incremental = false
