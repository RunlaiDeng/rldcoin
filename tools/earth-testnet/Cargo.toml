[package]
name = "rld-earth-testnet-bootstrap"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "=1.0.103"
ed25519-dalek = "=2.1.1"
hex = "=0.4.3"
serde_json = "=1.0.134"
sha2 = "=0.10.8"
rld-core = { path = "../../crates/rld-core" }
rld-pow = { path = "../../crates/rld-pow" }
rld-value-successor = { path = "../../crates/rld-value-successor" }
rld-regional-rules = { path = "../../crates/rld-regional-rules" }

reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "=1.53.1", features = ["full"] }
