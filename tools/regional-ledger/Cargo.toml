[package]
name = "rld-regional-ledger-candidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[workspace]

[dependencies]
rld-core = { path = "../../crates/rld-core" }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
sha2 = "=0.10.8"
hex = "=0.4.3"
clap = { version = "=4.5.23", features = ["derive"] }

ed25519-dalek = "=2.1.1"
zeroize = "=1.9.0"
base64 = "=0.22.1"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
getrandom = "=0.2.17"
libc = "=0.2.189"
rpassword = "=7.4.0"

[build-dependencies]
sha2 = "=0.10.8"
hex = "=0.4.3"
