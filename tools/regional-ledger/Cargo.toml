[package]
name = "rld-regional-ledger-candidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rld-core = { path = "../../crates/rld-core" }
rld-pow = { path = "../../crates/rld-pow" }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = { version = "=1.0.134", features = ["float_roundtrip"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
clap = { version = "=4.5.23", features = ["derive"] }

ed25519-dalek = "=2.1.1"
zeroize = "=1.9.0"
base64 = "=0.22.1"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
getrandom = "=0.2.17"
libc = "=0.2.189"
rpassword = "=7.4.0"

miniz_oxide = "=0.8.9"
subtle = "=2.6.1"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "zeroize"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }

[build-dependencies]
sha2 = "=0.10.8"
hex = "=0.4.3"

# Keep the native byte-commitment implementation optimized in ground builds;
# arithmetic and debug checks remain enabled, as in the default debug profile.
[profile.dev.package.sha2]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 1
debug-assertions = true
overflow-checks = true

# The bounded RFC1950 decoder still verifies the full checksum; optimize its
# pinned checksum dependency without disabling arithmetic or debug checks.
[profile.dev.package.adler2]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.adler2]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Keep all codec/debug arithmetic checks while optimizing the pinned bounded
# RFC1950 implementation used by the ordinary ground carriage candidate.
[profile.dev.package.miniz_oxide]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.miniz_oxide]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Ground SHA-256 code shares integer helpers instantiated by this pinned crate.
# Keep debug/arithmetic checks; no RNG, signature or entropy policy changes.
[profile.dev.package."rand_core:0.6.4"]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package."rand_core:0.6.4"]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Preserve all JSON parsing/canonicalization checks while optimizing the pinned
# serializer used by bounded native contact receipt interfaces.
[profile.dev.package.serde_json]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.serde_json]
opt-level = 1
debug-assertions = true
overflow-checks = true
